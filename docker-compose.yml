services:
  tradinga:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradinga:latest
    container_name: TradingA
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - tradinga_data:/var/lib/postgresql/data

volumes:
  tradinga_data:
